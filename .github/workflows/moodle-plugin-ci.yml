name: Moodle Plugin CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh
          --connect
          --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false

      matrix:
        include:
          # Current Moodle development branch (5.3dev), the top of $plugin->supported
          # in version.php.
          - moodle-branch: main
            php: '8.4'
            database: pgsql

          - moodle-branch: main
            php: '8.4'
            database: mariadb

          # Moodle 5.2
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: pgsql

          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: mariadb

          # Moodle 5.1
          - moodle-branch: MOODLE_501_STABLE
            php: '8.3'
            database: pgsql

          - moodle-branch: MOODLE_501_STABLE
            php: '8.3'
            database: mariadb

          # Moodle 5.0, the plugin's declared minimum (see $plugin->requires in version.php).
          - moodle-branch: MOODLE_500_STABLE
            php: '8.3'
            database: pgsql

          - moodle-branch: MOODLE_500_STABLE
            php: '8.3'
            database: mariadb

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      # The repository is named "moodle-auth_<slug>" by convention; the plugin
      # directory itself (and everything moodle-plugin-ci expects) is just
      # "<slug>", so derive it here instead of hardcoding it - this keeps the
      # workflow correct across forks/renames without any manual edits.
      - name: Determine plugin slug
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "PLUGIN_SLUG=${REPO_NAME#moodle-auth_}" >> "$GITHUB_ENV"

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: ${{ env.PLUGIN_SLUG }}
          persist-credentials: false

      # ---------------------------------------------------------
      # PHP
      # ---------------------------------------------------------

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, soap, curl, gd, xml, json, zip, pdo, pdo_mysql, pgsql, pdo_pgsql
          ini-values: max_input_vars=5000
          coverage: none

      # moodle-plugin-ci's Mustache Lint step shells out to a Java-based HTML
      # validator (vnu.jar) to check each template's rendered output. Without
      # an explicit setup, whether a working `java` ends up on PATH depends on
      # undocumented runner-image defaults - set up a known-good JDK instead
      # of relying on that.
      - name: Setup Java (for Mustache Lint's HTML validator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------------------------------------------------------
      # System dependencies
      # ---------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            unzip \
            mariadb-client \
            postgresql-client

      - name: Configure locale
        run: sudo locale-gen en_AU.UTF-8

      - name: Configure Node
        run: echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Clean extra files from plugin
        run: |
          rm -rf "$PLUGIN_SLUG/.git" "$PLUGIN_SLUG/.github" "$PLUGIN_SLUG/node_modules" "$PLUGIN_SLUG/tests" "$PLUGIN_SLUG/phpunit.xml" "$PLUGIN_SLUG/vendor"
          rm -f "$PLUGIN_SLUG"/composer.* "$PLUGIN_SLUG"/package*.json "$PLUGIN_SLUG/webpack.config.js" "$PLUGIN_SLUG/.zipignore"

      # ---------------------------------------------------------
      # Moodle Plugin CI
      # ---------------------------------------------------------

      - name: Install moodle-plugin-ci tooling
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH
        env:
          COMPOSER_NO_INTERACTION: 1

      # ---------------------------------------------------------
      # Install Moodle + plugin
      # ---------------------------------------------------------

      - name: Install Moodle
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: moodle-plugin-ci install --plugin "./$PLUGIN_SLUG" --db-host=127.0.0.1

      # ---------------------------------------------------------
      # PHP syntax
      # ---------------------------------------------------------

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # Moodle Coding Standards
      # ---------------------------------------------------------

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # PHPDoc
      # ---------------------------------------------------------

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0 "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # PHP Mess Detector
      # ---------------------------------------------------------

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpmd "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # Mustache templates
      # ---------------------------------------------------------

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        # No explicit plugin path here (unlike the other steps): mustache lint
        # renders templates through Moodle's own component/HTML-validator
        # machinery, which requires the plugin's actual in-Moodle-tree
        # location, not this checkout's original path. moodle-plugin-ci's
        # `install` step already recorded that correct path in PLUGIN_DIR
        # (loaded automatically from ci/.env on every invocation), so passing
        # our own path here would override it with the wrong one.
        run: moodle-plugin-ci mustache

      # ---------------------------------------------------------
      # JavaScript / AMD
      # ---------------------------------------------------------

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHP Code Beautifier and Fixer
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcbf "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # Plugin validation
      # ---------------------------------------------------------

      - name: Validate Plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # Database upgrade/savepoint checks
      # ---------------------------------------------------------

      - name: Check Upgrade Savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # PHPUnit
      # ---------------------------------------------------------

      - name: PHPUnit Tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --verbose --fail-on-warning "$PLUGIN_SLUG"

      # ---------------------------------------------------------
      # Behat
      # ---------------------------------------------------------

      - name: Run Behat Tests
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations "$PLUGIN_SLUG"

      - name: Upload Behat Faildump (if failed)
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ matrix.moodle-branch }}, ${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

  create_tag_and_release:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request')
    permissions:
      contents: write
    steps:
      - name: Determine plugin slug
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "PLUGIN_SLUG=${REPO_NAME#moodle-auth_}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: ${{ env.PLUGIN_SLUG }}

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Prepare Release Folder
        run: mkdir -p release

      - name: Build Zip using exclude.lst
        run: |
          zip -r "release/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG" -x@"$PLUGIN_SLUG/exclude.lst"

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        working-directory: ${{ env.PLUGIN_SLUG }}

      - name: Determine release date
        id: reldate
        run: |
          DAY=$(date -u +%-d)
          case $DAY in
            1|21|31) SUFFIX="st" ;;
            2|22) SUFFIX="nd" ;;
            3|23) SUFFIX="rd" ;;
            *) SUFFIX="th" ;;
          esac
          echo "date=${DAY}${SUFFIX} $(date -u +'%B %Y')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/${{ env.PLUGIN_SLUG }}.zip
          body: |
            We're pleased to announce the official release of MooWoodle Connect for Moodle v${{ steps.version.outputs.version }}.

            Thank you for using our MooWoodle Connect plugin and for being part of the Moodle community.

            Release Information

            Version: v${{ steps.version.outputs.version }}
            Release: Official
            Date: ${{ steps.reldate.outputs.date }}

            Thank you for choosing our plugin. We appreciate your continued support!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
